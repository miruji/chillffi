[package]
name = "chillffi"
version = "0.4.0"
edition = "2024"

#
authors = ["miruji <miruji@protonmail.com>"]
description = "A simple isolated dynamic FFI framework for Rust"
license-file = "LICENSE.md" # FCL

# ======================================================================================================================

autobins = false
autotests = false
autobenches = false

# ======================================================================================================================

# For publish test:
# cargo publish --dry-run
# cargo package --list

repository = "https://github.com/rts-lang/chillffi"
keywords = ["ffi", "zygote", "ipc", "sandbox", "fork"]
categories = ["external-ffi-bindings", "os::unix-apis", "os::windows-apis", "api-bindings"]
publish = true

include = [
  "src/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE.md"
]

documentation = "https://docs.rs/chillffi"
[package.metadata.docs.rs]
# libffi-sys cannot cross-compile its C code inside the docs.rs Linux
# Docker image. Feature `check_only` makes libffi-sys skip building C
# entirely (build.rs returns immediately) — enough for rustdoc.
features = ["docsrs"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc"
]

# ======================================================================================================================

# Building as a cdylib is not provided. Works only in Rust.

# ======================================================================================================================

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
overflow-checks = false
debug  = false
incremental = false
rpath = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
lto = false
incremental = true

# ======================================================================================================================

[target.'cfg(windows)'.build-dependencies]
cc = "1.2"
# Locates cl.exe/link.exe on Windows for build.rs; unused elsewhere.

# ======================================================================================================================

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
# Provides binary serialization format for serde, used for efficient encoding
# and decoding of IPC messages between isolated processes.

libloading = { version = "0.9.0" }
# Used for dynamic library loading (libraryPath)
# and obtaining pointers to functions (methodName), which are then called.

libffi = { version = "5.2.0" }
# Provides dynamic calling of C functions with arbitrary signatures
# (number and types of arguments, return type) at runtime.
# Unlike statically hardcoded wrappers, libffi allows constructing
# a call on the fly based on a type description, which is good for FFI.

libc = { version = "1.0.0-alpha.4" }
# Process control (fork/kill/waitpid, dladdr) and the raw allocator
# (malloc/posix_memalign/free, _aligned_malloc on Windows) behind src/sys.
# Also ENOENT and a couple of other constants used directly in tests.

serde = { version = "1.0.229", features = ["derive"] }
# Serialization and deserialization of request and response structures.

serde_bytes = "0.11.19"
# todo desc

ctor = "1.0.13"
# Execution of functions at process startup for automatic initialization.

fxhash = "0.2.1"
# Fast HashMap without additional protection against hash attacks.

parking_lot = "0.12.5"
# Fast and compact synchronization primitives without lock poisoning.

bytemuck = { version = "1.25.2", features = ["derive"] }
# Zero-cost casting of POD types. Used for static repr structures
# (readStruct<T>) to safely reinterpret raw bytes as typed structs.

ipc-channel = "0.23.0"
# Cross-platform IPC:
# - Unix sockets + SCM_RIGHTS on Linux;
# - Mach ports on macOS;
# - named pipes on Windows.

# ======================================================================================================================

[features]
# Enabled only on docs.rs. Propagates to libffi-sys so it skips compiling
# the native libffi C sources (required because docs.rs cross-compiles
# without the proper C toolchains).
docsrs = ["libffi/check_only"]

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"
non_camel_case_types = "allow"

# ======================================================================================================================

# Usage examples:
# cargo run --example simple

# ======================================================================================================================

# Testing:
# cargo test

# ======================================================================================================================

# Clippy debugging:
# cargo clippy --all-targets -- -D warnings

[lints.clippy]
unused_unit = "allow"
option_if_let_else = "allow"
collapsible_if = "allow"
too_long_first_doc_paragraph = "allow"
len_without_is_empty = "allow"
nursery = { level = "warn", priority = -1 } # At the very bottom

# ======================================================================================================================